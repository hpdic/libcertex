name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install clang-format==20.1.8
      - name: clang-format
        run: git ls-files '*.cu' '*.cuh' '*.cpp' '*.hpp' '*.h' '*.c' | xargs clang-format --dry-run --Werror

  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # the tests import certex from the checkout; building the CUDA extension needs a GPU runner (gpu.yml)
      - run: pip install numpy pytest
      - run: pytest -m "not gpu" -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy mkdocs==1.6.1 mkdocs-material==9.5.39 mkdocstrings==0.26.1 mkdocstrings-python==1.11.1 pymdown-extensions==10.11.2
      - run: mkdocs build --strict
